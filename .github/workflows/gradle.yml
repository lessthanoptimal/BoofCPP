# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: 'zulu'
        cache: 'gradle'
    - name: Install libjpeg and libpng for the C++ benchmarks
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev libpng-dev
    - name: Build C++
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j $(nproc)
    - name: C++ Unit Tests
      run: ctest --test-dir build --output-on-failure
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Java Unit Tests
      run: ./gradlew test
    - name: Compile the JMH benchmarks and the accuracy tool
      run: ./gradlew compileBenchmarkJava compileAccuracyJava
    - name: Native jars work on their own
      run: |
        mv build build_hidden
        ./gradlew nativeJarCheck -Pnative_build_location=build_hidden
        mv build_hidden build
